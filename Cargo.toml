[package]
name = "fast-code-editor"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A native Rust code editor built for large projects and huge text files"
license = "MIT"

[dependencies]
anyhow = "1.0"
crossbeam-channel = "0.5"
eframe = "0.32"
egui_material_icons = "0.4"
ignore = "0.4"
lsp-types = "0.94.1"
memchr = "2.7"
memmap2 = "0.9"
rfd = "0.18"
ropey = "1.6"
serde_json = "1"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] }
tempfile = "3.23"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"] }
url = "2.5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3.2"
raw-window-handle = "0.6"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
